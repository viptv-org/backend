name: backend checks

on:
  pull_request:
    branches: [edge, main]
  push:
    branches: [edge]

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --manifest-path server/Cargo.toml
      - run: cargo test --manifest-path server/Cargo.toml --features live-runtime --no-run
      - run: python3 scripts/sync-engine.py check
