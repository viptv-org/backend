name: Backend CI and image delivery
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --include-ignored --test-threads=2
        env:
          VIPTV_TEST_FFMPEG: /usr/bin/ffmpeg
          VIPTV_TEST_FFPROBE: /usr/bin/ffprobe
  image:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned web release bundle
        run: python3 scripts/verify-web.py
      - run: bash -n scripts/host-check.sh && python3 tests/test_host_check.py
      - run: VIPTV_AUTH_ORIGIN=https://ci.example docker compose --env-file /dev/null config --quiet
      - name: Build candidate
        run: docker build -t viptv:ci -t viptv:local .
      - name: Isolated API and media acceptance
        run: bash scripts/container-check.sh
      - name: Preserve tested image for delivery
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save viptv:ci | gzip > backend-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tested-backend-image
          path: backend-image.tar.gz
          retention-days: 3
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-backend-image
      - name: Publish exact tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gzip -dc backend-image.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/viptv-org/backend"
          docker tag viptv:ci "$image:$GITHUB_SHA"
          docker tag viptv:ci "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_REF_NAME"
          docker inspect "$image:$GITHUB_SHA" --format '{{json .RepoDigests}}' > image-digests.json
          gh release create "$GITHUB_REF_NAME" image-digests.json --verify-tag --generate-notes
