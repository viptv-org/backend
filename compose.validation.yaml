# Disposable acceptance project. Never merge with deployment compose.yaml.
x-sandbox: &sandbox
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [validation]
  restart: "no"
  init: true
  stop_grace_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

x-fixture: &fixture
  <<: *sandbox
  image: ${VIPTV_INTEGRATION_IMAGE:-viptv:integration}
  pull_policy: never
  tmpfs:
    - /media:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
  entrypoint: [/bin/sh, -ec]
  command:
    - >-
      printf '1\n00:00:01,000 --> 00:00:04,000\nEarly English caption\n\n2\n00:00:12,000 --> 00:00:16,000\nLater English caption\n' > /media/fixture.srt &&
      /usr/bin/ffmpeg -hide_banner -loglevel error
      -f lavfi -i testsrc2=size=640x360:rate=30
      -f lavfi -i sine=frequency=440:sample_rate=48000
      -f lavfi -i "aevalsrc=sin(2*PI*if(lt(t\,10)\,880\,1320)*t):s=48000"
      -f lavfi -i sine=frequency=660:sample_rate=48000
      -i /media/fixture.srt
      -map 0:v:0 -map 1:a:0 -map 2:a:0 -map 3:a:0 -map 4:s:0
      -t 20 -c:v libx264 -preset ultrafast -profile:v main
      -pix_fmt yuv420p -g 120 -c:a aac -ac 2
      -metadata:s:a:0 language=ita -metadata:s:a:0 title=Italian
      -metadata:s:a:1 language=eng -metadata:s:a:1 title=English
      -metadata:s:a:2 language=eng -metadata:s:a:2 "title=English Commentary"
      -c:s mov_text -metadata:s:s:0 language=eng -metadata:s:s:0 "title=English Captions"
      -disposition:a:0 default -disposition:a:1 0 -disposition:a:2 comment -movflags +faststart
      -n /media/fixture.mp4 &&
      exec python3 tests/mock_upstream.py --bind 0.0.0.0
      --port "$$FIXTURE_PORT" --public-base "$$FIXTURE_BASE"
      --series-delay "$$FIXTURE_DELAY" --media /media/fixture.mp4
  healthcheck:
    test: [CMD-SHELL, 'python3 -c "import os,urllib.request; urllib.request.urlopen(\"http://127.0.0.1:\"+os.environ[\"FIXTURE_PORT\"]+\"/fast/manifest.json\",timeout=2).read()"']
    interval: 2s
    timeout: 3s
    start_period: 30s
    retries: 20

services:
  server:
    <<: *sandbox
    image: ${VIPTV_BASE_IMAGE:-viptv:local}
    pull_policy: never
    environment:
      VIPTV_BIND: 0.0.0.0:8080
      VIPTV_DATABASE: /data/viptv.sqlite
      VIPTV_MEDIA_DIR: /cache/hls
      VIPTV_DASHBOARD_DIST: /app/dashboard
      VIPTV_FFMPEG: /usr/bin/ffmpeg
      VIPTV_FFPROBE: /usr/bin/ffprobe
      VIPTV_AUTH_ORIGIN: https://server:8080
      VIPTV_TEST_USERNAME: acceptance-owner
      VIPTV_TEST_PASSWORD: account-acceptance-owner-password
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        printf '%s\n' "$$VIPTV_TEST_PASSWORD" |
        /usr/local/bin/viptv-server create-admin "$$VIPTV_TEST_USERNAME" "Acceptance Owner" >/dev/null &&
        exec /usr/local/bin/viptv-server
    tmpfs:
      - /data:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700
      - /cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", --output, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 20

  fixtures:
    <<: *fixture
    environment:
      FIXTURE_PORT: "19090"
      FIXTURE_BASE: http://fixtures:19090
      FIXTURE_DELAY: "0"

  slow-fixtures:
    <<: *fixture
    environment:
      FIXTURE_PORT: "19091"
      FIXTURE_BASE: http://slow-fixtures:19091
      FIXTURE_DELAY: "3"

  checks:
    <<: *sandbox
    image: ${VIPTV_INTEGRATION_IMAGE:-viptv:integration}
    pull_policy: never
    build:
      context: ./tests
      dockerfile: Dockerfile.integration
      args:
        VIPTV_BASE_IMAGE: ${VIPTV_BASE_IMAGE:-viptv:local}
    environment:
      VIPTV_TEST_URL: http://server:8080
      VIPTV_TEST_ORIGIN: https://server:8080
      VIPTV_TEST_USERNAME: acceptance-owner
      VIPTV_TEST_PASSWORD: account-acceptance-owner-password
      VIPTV_TEST_UPSTREAM: http://fixtures:19090
      VIPTV_TEST_FAST_UPSTREAM: http://fixtures:19090
      VIPTV_TEST_SLOW_UPSTREAM: http://slow-fixtures:19091
      VIPTV_TEST_FFPROBE: /usr/bin/ffprobe
      VIPTV_TEST_FFMPEG: /usr/bin/ffmpeg
      VIPTV_TEST_PLAYBACK: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    depends_on:
      server:
        condition: service_healthy
      fixtures:
        condition: service_healthy
      slow-fixtures:
        condition: service_healthy
    entrypoint: [/usr/bin/timeout, --signal=TERM, --kill-after=10s, 240s, /bin/sh, -ec]
    command: ["python3 tests/smoke.py && python3 tests/incremental_providers.py && python3 tests/account_smoke.py"]

networks:
  validation:
    internal: true
