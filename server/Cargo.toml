[package]
name = "viptv-server"
default-run = "viptv-server"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
rust-version = "1.90"

[dependencies]
service-telemetry = { path = "shared/service-telemetry" }
viptv-core = { path = "shared/core/crates/viptv-core" }
torrent-policy = { path = "shared/playback-gateway/torrent-policy" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
viptv-provider = { path = "provider", features = ["discovery"] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "limit", "cors"] }
futures = "0.3"
base64 = "0.22"
flate2 = "1"
unicode-normalization = "0.1"
argon2 = "0.5"
sha2 = "0.10"
ring = "0.17"
zeroize = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false }
png = "0.17"

chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["functions"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
