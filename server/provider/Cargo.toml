[package]
name = "viptv-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-only"
description = "Pure Xtream/addon client logic shared between the VIPTV backend server and the shared core"

[features]
default = ["extras", "candidate"]
extras = []
candidate = []
discovery = ["extras"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
unicode-normalization = "0.1"

[lib]
name = "viptv_provider"