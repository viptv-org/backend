[package]
name = "viptv-provider"
version = "0.1.0"
# Literal values (not `.workspace = true`): backend/scripts/sync-provider.sh
# vendors this manifest outside this workspace. Keep them equal to
# [workspace.package] in the root Cargo.toml.
edition = "2024"
rust-version = "1.90"
license = "GPL-2.0-only"
description = "Pure Xtream/addon client logic for the VIPTV backend server (vendored from viptv-org/core)"

[features]
default = ["extras", "candidate"]
extras = []
candidate = []
discovery = ["extras"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
unicode-normalization = "0.1"

[lib]
name = "viptv_provider"