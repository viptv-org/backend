[package]
name = "viptv-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = []
source-runtime = ["runtime", "dep:reqwest"]
vsources-runtime = ["source-runtime", "dep:vsources", "dep:async-trait"]
runtime = ["dep:tokio", "dep:rusqlite", "dep:futures", "dep:argon2"]

[dependencies]
argon2 = { version = "0.5", features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
url = "2"
facet = "=0.46.5"
thiserror = "2"
viptv-provider = { path = "../../provider", features = ["discovery"] }
tokio = { version = "1", features = ["time", "rt", "sync", "macros", "net"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
futures = { version = "0.3", optional = true }

vsources = { git = "https://github.com/vynxc/vsources.git", rev = "81388c46685391f97d24ad06034e3d07002bc444", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "sync", "macros", "net", "test-util"] }

