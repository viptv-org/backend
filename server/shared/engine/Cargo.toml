[package]
name = "viptv-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[features]
default = []
runtime = ["dep:tokio", "dep:rusqlite", "dep:futures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
facet = "=0.46.5"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "sync", "macros", "test-util"] }

