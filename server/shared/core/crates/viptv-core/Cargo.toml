[package]
name = "viptv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
typegen = ["facet_typegen"]
facet_typegen = ["crux_core/facet_typegen", "crux_http/facet_typegen"]
live-runtime = ["native", "viptv-engine/source-runtime", "dep:tokio"]
vsources-runtime = ["native", "viptv-engine/vsources-runtime", "dep:tokio"]
native = ["dep:uniffi", "viptv-engine/runtime"]
bindgen = ["native", "uniffi/cli"]

[dependencies]
viptv-engine = { path = "../../../engine" }
base64 = "0.22.1"
sha1 = "0.10.6"
unicode-normalization = "0.1.24"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
crux_core.workspace = true
crux_http.workspace = true
facet.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
url = "2"
thiserror = "2"
uniffi = { version = "0.29.4", optional = true }
uuid = { version = "1", features = ["v4"] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust"] }

[[bin]]
name = "viptv-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
