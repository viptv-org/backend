services:
  viptv:
    build:
      context: .
      dockerfile: Dockerfile
    image: viptv:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # LAN reachable by default. Limit to your LAN interface/firewall; never port-forward.
      - "${VIPTV_PUBLISH_IP:-0.0.0.0}:${VIPTV_PORT:-8080}:8080"
    environment:
      # Required exact public HTTPS dashboard origin; Compose stops if it is unset/empty.
      VIPTV_AUTH_ORIGIN: "${VIPTV_AUTH_ORIGIN:?Set VIPTV_AUTH_ORIGIN to one exact public HTTPS origin}"
      VIPTV_BIND: "0.0.0.0:8080"
      VIPTV_DATABASE: /data/viptv.sqlite
      VIPTV_DASHBOARD_DIST: /app/dashboard
      VIPTV_TV_DIST: /app/tv
      # Optional bare mapping: an absent keyring is omitted, never an empty JSON
      # value. Configured host/project values pass through without public defaults.
      VIPTV_SECRETS_KEYRING:
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-false}"
      NEW_RELIC_REGION: "${NEW_RELIC_REGION:-US}"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
      OBSERVABILITY_DAILY_BYTES: "${OBSERVABILITY_DAILY_BYTES:-10485760}"
      OBSERVABILITY_TRACE_SAMPLE_RATE: "${OBSERVABILITY_TRACE_SAMPLE_RATE:-0.1}"
      OBSERVABILITY_EXPORT_INTERVAL_SECONDS: "${OBSERVABILITY_EXPORT_INTERVAL_SECONDS:-30}"
      OBSERVABILITY_BUDGET_PATH: /data/observability-budget.json
    volumes:
      - viptv_data:/data
    # Temporary control-plane files only; media storage belongs to the gateway.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  viptv_data:
    name: viptv_viptv_data
